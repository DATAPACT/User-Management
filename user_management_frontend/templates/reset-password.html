{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<main style="padding:120px 0 80px; min-height: 70vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm border-0" style="border-radius: 24px;">
          <div class="card-body p-5">
            <h2 class="mb-3">Reset Password</h2>
            <p class="text-muted mb-4">This page is the next step. The password reset form will be added here.</p>
            <div class="d-flex gap-3 flex-wrap">
              <a class="btn btn-primary" href="{% url 'manage_account' %}">Back to Manage Account</a>
              <a class="btn btn-outline-primary" href="{% url 'logout' %}">Logout</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
